<main class="pagina">
  <section class="card card--login" aria-labelledby="login-titulo">
    <header class="topo">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
          <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
          <path d="M12 5v13" />
        </svg>
      </div>
      <h1 id="login-titulo" class="titulo">Mnemos</h1>
      <p class="subtitulo">Bora continuar seus estudos?</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="campo">
        <label class="rotulo" for="login-email">E-mail <span class="obrigatorio" aria-hidden="true">*</span></label>
        <input
          id="login-email"
          class="input"
          type="email"
          formControlName="email"
          autocomplete="email"
          required
          [attr.aria-invalid]="erro('email') ? 'true' : null"
          [attr.aria-describedby]="erro('email') ? 'login-email-erro' : null"
          (input)="esconderErro('email')"
        />
        @if (erro('email'); as mensagem) {
          <p id="login-email-erro" class="erro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5M12 16.2v.1" />
            </svg>
            {{ mensagem }}
          </p>
        }
      </div>

      <div class="campo">
        <label class="rotulo" for="login-senha">Senha <span class="obrigatorio" aria-hidden="true">*</span></label>
        <div class="senha">
          <input
            id="login-senha"
            class="input"
            [type]="senhaVisivel() ? 'text' : 'password'"
            formControlName="senha"
            autocomplete="current-password"
            required
            [attr.aria-invalid]="erro('senha') ? 'true' : null"
            [attr.aria-describedby]="erro('senha') ? 'login-senha-erro' : null"
            (input)="esconderErro('senha')"
          />
          <button
            class="olho"
            type="button"
            aria-label="Mostrar senha"
            [attr.aria-pressed]="senhaVisivel()"
            (click)="senhaVisivel.set(!senhaVisivel())"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" />
              @if (senhaVisivel()) {
                <path d="M3 3l18 18" />
              }
            </svg>
          </button>
        </div>
        @if (erro('senha'); as mensagem) {
          <p id="login-senha-erro" class="erro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5M12 16.2v.1" />
            </svg>
            {{ mensagem }}
          </p>
        }
      </div>

      <button class="botao" type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="rodape">Ainda não tem conta? <a routerLink="/cadastro">Criar conta</a></p>
  </section>
</main>
