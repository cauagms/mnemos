<dialog
  #dialogo
  class="dialogo"
  aria-labelledby="topico-dialogo-titulo"
  (cancel)="$event.preventDefault(); cancelarEdicao()"
>
  <h2 id="topico-dialogo-titulo" class="titulo">{{ topico() ? 'Editar tópico' : 'Novo tópico' }}</h2>

  <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <label class="rotulo" for="topico-nome">Nome do tópico</label>
    <input
      #campo
      id="topico-nome"
      class="input"
      type="text"
      formControlName="nome"
      placeholder="Ex.: Normalização"
      autocomplete="off"
      required
      [attr.aria-invalid]="erroVisivel() ? 'true' : null"
      [attr.aria-describedby]="erroVisivel() ? 'topico-nome-erro' : null"
      (input)="erroVisivel.set(false)"
    />
    @if (erroVisivel()) {
      <p id="topico-nome-erro" class="erro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" /><path d="M12 7.5v5M12 16.2v.1" />
        </svg>
        Informe o nome do tópico.
      </p>
    }

    <fieldset class="formatos">
      <legend class="rotulo">Como você quer estudar este tópico?</legend>
      <div class="opcoes">
        <label class="opcao">
          <input type="radio" formControlName="formato" value="flashcards" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="6" width="14" height="12" rx="2" /><path d="M8 3.5h11a2 2 0 0 1 2 2v9" />
          </svg>
          Flashcards
        </label>
        <label class="opcao">
          <input type="radio" formControlName="formato" value="quiz" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5" /><path d="M9.6 9.4a2.4 2.4 0 1 1 3.4 2.2c-.6.4-1 .9-1 1.6M12 16.4v.1" />
          </svg>
          Quiz
        </label>
      </div>
      @if (formatoMudou()) {
        <p class="aviso">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" /><path d="M12 11v5.2M12 7.8v.1" />
          </svg>
          Mudar o formato não afeta os cards já criados, apenas os próximos materiais enviados a este tópico.
        </p>
      }
    </fieldset>

    <div class="botoes">
      <button class="botao botao--secundario" type="button" (click)="cancelarEdicao()">Cancelar</button>
      <button class="botao" type="submit" [disabled]="salvando()">
        @if (topico()) {
          {{ salvando() ? 'Salvando...' : 'Salvar' }}
        } @else {
          {{ salvando() ? 'Criando...' : 'Criar' }}
        }
      </button>
    </div>
  </form>
</dialog>
