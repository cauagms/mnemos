<article class="cartao">
  <div class="topo">
    <div class="icone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12.6 3H20a1 1 0 0 1 1 1v7.4a1 1 0 0 1-.3.7l-8.6 8.6a1 1 0 0 1-1.4 0l-7.4-7.4a1 1 0 0 1 0-1.4l8.6-8.6a1 1 0 0 1 .7-.3Z" /><path d="M16.5 7.5v.01" />
      </svg>
    </div>

    <div class="menu">
      <button
        #botaoAcoes
        class="mais"
        type="button"
        [attr.aria-label]="'Ações do tópico ' + topico().nome"
        [attr.aria-expanded]="acoesAbertas()"
        [attr.aria-controls]="acoesAbertas() ? 'acoes-topico-' + topico().id : null"
        (click)="alternarAcoes()"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" />
        </svg>
      </button>

      @if (acoesAbertas()) {
        <div class="acoes" [id]="'acoes-topico-' + topico().id">
          <button #primeiraAcao class="acao" type="button" (click)="escolher('editar')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.17 6.81a2.83 2.83 0 0 0-4-4L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z" />
            </svg>
            Editar
          </button>
          <button class="acao acao--perigo" type="button" (click)="escolher('excluir')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" /><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><path d="M10 11v6M14 11v6" />
            </svg>
            Excluir
          </button>
        </div>
      }
    </div>
  </div>

  <h2 class="nome">
    <a class="link" [routerLink]="rota()">{{ topico().nome }}</a>
  </h2>

  <span class="formato">{{ topico().formato === 'quiz' ? 'Quiz' : 'Flashcards' }}</span>

  <a class="enviar" [routerLink]="rota()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M4.5 16v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V16" />
    </svg>
    Enviar material
  </a>
</article>
